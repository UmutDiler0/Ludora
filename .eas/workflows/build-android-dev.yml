name: Build Android dev client

# No `on:` trigger on purpose — manual only, per the earlier decision not to
# burn EAS's free-tier build minutes automatically on every push while this
# is still new. Run it with:
#   npx eas-cli workflow:run .eas/workflows/build-android-dev.yml
# or from the EAS dashboard's Workflows tab once the repo is connected there.

jobs:
  build_android_dev:
    name: Build Android (development profile)
    type: build
    params:
      platform: android
      profile: development
